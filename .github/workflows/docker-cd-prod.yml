name: BE Docker CD Prod

on:
  workflow_run:
    workflows: ["BE Docker CI Prod"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Deploy to GCP VM
    runs-on: ubuntu-latest


    steps:
      - name: Set Image Tag
        run: echo "IMAGE_TAG=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/youtil-docker-registry/youtil-be-prod:latest" >> $GITHUB_ENV
             echo "IMAGE_TAG=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/youtil-docker-registry/youtil-be-prod:stable" >> $GITHUB_ENV

      - name: Prepare SSH Keys
        run: |
          echo "${{ secrets.YOUTIL_PROD_SSH_KEY }}" > key.pem
          echo "${{ secrets.YOUTIL_BASTION_SSH_KEY }}" > bastion_key.pem
          chmod 600 key.pem
          chmod 600 bastion_key.pem

      - name: Deploy via SSH with Rollback
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.YOUTIL_PROD_HOST }} << 'EOF'
            set -e
            docker pull ${{ env.LATEST_IMAGE }}

            docker stop youtil-be-prod || true
            docker rm youtil-be-prod || true

            docker run -d --name youtil-be-prod \
              -p 8080:8080 \
              ${{ env.LATEST_IMAGE }}

            echo "Waiting for app to become healthy..."
            sleep 10

            if ! curl -sf http://localhost:8080/health; then
              echo "Health check failed. Rolling back to prod-stable..."
              docker stop youtil-be-prod || true
              docker rm youtil-be-prod || true

              docker pull ${{ env.STABLE_IMAGE }}
              docker run -d --name youtil-be-prod \
                -p 8080:8080 \
                ${{ env.STABLE_IMAGE }}
            else
              echo "Health check passed. Updating prod-stable tag..."
              docker tag ${{ env.LATEST_IMAGE }} ${{ env.STABLE_IMAGE }}
              docker push ${{ env.STABLE_IMAGE }}
            fi
          EOF
