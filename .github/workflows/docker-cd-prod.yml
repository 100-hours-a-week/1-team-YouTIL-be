name: BE Docker CD Prod

on:
  workflow_run:
    workflows: ["BE Docker CI Prod"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Deploy to GCP VM
    runs-on: ubuntu-latest


    steps:
      - name: Set Image Tag
        run: echo "IMAGE_TAG=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/youtil-docker-registry/youtil-be-prod:latest" >> $GITHUB_ENV

      - name: Prepare SSH Keys
        run: |
          echo "${{ secrets.YOUTIL_PROD_SSH_KEY }}" > key.pem
          echo "${{ secrets.YOUTIL_BASTION_SSH_KEY }}" > bastion_key.pem
          chmod 600 key.pem
          chmod 600 bastion_key.pem

      - name: Deploy via SSH Tunnel
        run: |
          # Create SSH tunnel through bastion host
          ssh -i bastion_key.pem -o StrictHostKeyChecking=no -N -L 2222:${{ secrets.YOUTIL_PROD_HOST }}:22 ubuntu@${{ secrets.YOUTIL_BASTION_HOST }} &
          TUNNEL_PID=$!
          
          # Wait for tunnel to establish
          sleep 5
          
          # Deploy through the tunnel
          ssh -i key.pem -o StrictHostKeyChecking=no -p 2222 ubuntu@localhost << 'EOF'
            docker pull ${{ env.IMAGE_TAG }}

            docker stop youtil-be-prod || true
            docker rm youtil-be-prod || true

            docker run -d --name youtil-be-prod \
              -p 8080:8080 \
              -v /home/ubuntu/logs:/logs \
              ${{ env.IMAGE_TAG }}
          EOF
          
          # Clean up tunnel
          kill $TUNNEL_PID 

