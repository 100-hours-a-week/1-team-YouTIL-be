name: BE Docker CD Prod

on:
  workflow_run:
    workflows: ["BE Docker CI Prod"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Set Image Tag
        run: |
          echo "LATEST_IMAGE=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/youtil-docker-registry/youtil-be-prod:latest" >> $GITHUB_ENV
          echo "STABLE_IMAGE=asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/youtil-docker-registry/youtil-be-prod:stable" >> $GITHUB_ENV

      - name: Prepare SSH Keys
        run: |
          echo "${{ secrets.YOUTIL_PROD_OPENVPN_CONFIG }}" | base64 --decode > youtil-prod.ovpn
          echo "${{ secrets.YOUTIL_PROD_SSH_KEY }}" > youtil-prod.pem
          chmod 600 youtil-prod.pem

      - name: Install OpenVPN
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Connect to VPN in background
        run: |
          sudo openvpn --config youtil-prod.ovpn --daemon
          sleep 10

      - name: Deploy via SSH with Rollback
        run: |
          ssh -i youtil-prod.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.YOUTIL_PROD_HOST }} << 'EOF'
            set -e
            docker pull ${{ env.LATEST_IMAGE }}

            docker stop youtil-be-prod || true
            docker rm youtil-be-prod || true

            docker run -d --name youtil-be-prod \
              -p 8080:8080 \
              ${{ env.LATEST_IMAGE }}

            echo "Waiting for app to become healthy..."
            MAX_RETRIES=12
            RETRY_INTERVAL=5
            RETRIES=0

            until curl -sf http://localhost:8080/health || [ $RETRIES -eq $MAX_RETRIES ]; do
              echo "Health check attempt $RETRIES/$MAX_RETRIES failed. Retrying in $RETRY_INTERVAL seconds..."
              sleep $RETRY_INTERVAL
              RETRIES=$((RETRIES+1))
            done

            if [ $RETRIES -eq $MAX_RETRIES ]; then
              echo "Health check failed after maximum retries. Rolling back to prod-stable..."
              docker stop youtil-be-prod || true
              docker rm youtil-be-prod || true

              docker pull ${{ env.STABLE_IMAGE }}
              docker run -d --name youtil-be-prod \
                -p 8080:8080 \
                ${{ env.STABLE_IMAGE }}
            else
              echo "Health check passed. Updating prod-stable tag..."
              docker tag ${{ env.LATEST_IMAGE }} ${{ env.STABLE_IMAGE }}
              docker push ${{ env.STABLE_IMAGE }}
            fi
          EOF

      - name: Disconnect VPN
        run: sudo killall openvpn || true

      - name: Clean up old Docker images
        run: |
          docker image prune -af